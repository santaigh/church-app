# ---------------------------------------------------------------------------
# Shared configuration. Everything here is true in every environment.
#
# Anything that differs between environments lives in the profile files:
#   application-dev.yml    local development
#   application-uat.yml    user acceptance testing
#   application-prod.yml   production
#
# Credentials are never in this file, or in any committed file.
# ---------------------------------------------------------------------------
spring:
  application:
    name: church-mgmt-app

  config:
    # Local credentials live in application-local.yml at the PROJECT ROOT -- gitignored,
    # and deliberately not under src/main/resources, because anything there is packaged
    # into the jar. Since imported properties take precedence over environment variables,
    # a jar carrying that file would override the real credentials on a deployed server.
    #
    # `file:` reads it from the working directory, so it applies when running from the
    # project and is simply absent in any deployment. "optional:" means its absence is
    # not an error -- credentials then come from the environment, as they should.
    import: optional:file:./application-local.yml

  profiles:
    # Overridden per deployment with SPRING_PROFILES_ACTIVE=uat / prod.
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Host and schema differ per environment; the driver and pool do not.
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    # Deliberately has NO fallback. A default here would be a real password, and once
    # committed it would stay in the git history for good. A missing value produces a
    # clear startup failure, which is far better than silently trying a wrong one.
    password: ${DB_PASSWORD}
    hikari:
      pool-name: church-hikari
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway, never by Hibernate. `validate` makes startup fail if
      # an entity and its table have drifted apart, so a mapping mistake surfaces
      # immediately instead of as a runtime error on some rarely-used screen.
      ddl-auto: validate
    properties:
      hibernate:
        # Dialect is auto-detected from the connection; setting it explicitly only
        # produces a deprecation warning.
        format_sql: true

  flyway:
    enabled: true
    # NOTE: `locations` is set per profile, not here. Development includes the sample
    # data in db/seed; UAT and production apply db/migration only. See the profile files.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Existing schema created outside Flyway"
    # BCrypt hashes contain '$'. Flyway's placeholder prefix is '${' so they are safe
    # either way, but replacement is off to remove the risk entirely.
    placeholder-replacement: false
    encoding: UTF-8

  servlet:
    multipart:
      # The logo upload checks 2MB itself; without this Spring refuses first, with a
      # container-level error rather than the message the screen wants to show.
      max-file-size: 2MB
      max-request-size: 4MB

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    # GlobalExceptionHandler renders our own pages; the whitelabel page must not win.
    whitelabel:
      enabled: false
    path: /error
    # Stack traces are never sent to a browser in any environment.
    include-stacktrace: never
    include-exception: false

# Log levels and appenders are owned by logback-spring.xml, per profile, so that there
# is a single source of truth for logging.

app:
  security:
    # Dial code assumed when a mobile number is typed without one. Change this single
    # value for a deployment in another country; numbers typed with an explicit '+' are
    # always honoured as-is, so overseas numbers work either way.
    default-country-code: ${APP_DEFAULT_COUNTRY_CODE:+91}
    # Assigned when an account is created; password_flag = 0 forces a change on first use.
    # These are policy, not secrets -- every new user is told their password. Override
    # them per environment all the same, since the committed values are public.
    default-password: ${APP_DEFAULT_PASSWORD:Welcome123$}
    reset-password: ${APP_RESET_PASSWORD:PleaseReset@123}
    # A reset restores a known password, so the form must not be usable without limit.
    max-password-resets-per-hour: 3
    # Consecutive wrong passwords before the account locks. No automatic expiry --
    # an administrator must clear locked_at.
    max-failed-login-attempts: 5
  storage:
    # Per-church logos, one file per church named <church_id>.png. Outside the jar,
    # and never mapped as a static resource root -- see AppStorageProperties.
    logo-dir: ${APP_LOGO_DIR:./data/logos}
  payment:
    # Floor for a family's monthly contribution. A priest may raise or lower the amount,
    # but not below this. Platform-wide for now; can move to a per-church setting later
    # without touching the payment tables.
    min-monthly-amount: 50.00
    # Receipt numbering resets every January (calendar year, not financial year).
    receipt-prefix: R
