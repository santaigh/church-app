<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Collect payment')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<main class="page">
    <div class="page-head">
        <h1 th:text="#{payment.collect}">Collect payment</h1>
        <p class="muted" th:text="#{payment.chooseFamily}">Choose the family paying.</p>
    </div>

    <form method="get" th:action="@{/payments/collect}" class="search-bar">
        <input type="search" name="q" th:value="${q}" th:placeholder="#{payment.searchFamily}"
               autofocus>
        <button class="btn" type="submit" th:text="#{table.search}">Search</button>
    </form>

    <p class="empty" th:if="${#lists.isEmpty(paged.rows)}" th:text="#{payment.noFamilies}">
        No families match.
    </p>

    <!-- Big touch targets: this screen is used standing up, on a phone. -->
    <div class="family-cards">
        <a class="family-card" th:each="f : ${paged.rows}"
           th:href="@{/payments/collect/{id}(id=${f.familyId})}">
            <span class="family-card-name" th:text="${f.familyName}">Family</span>
            <span class="family-card-meta">
                <span th:text="${f.familyCode}">FAM-001</span>
                <span th:if="${f.headName}" th:text="' · ' + ${f.headName}"></span>
            </span>
            <span class="family-card-owed" th:if="${f.outstanding.signum() > 0}"
                  th:text="#{payment.owes(${f.outstanding})}">owes 900</span>
            <span class="family-card-clear" th:if="${f.outstanding.signum() == 0}"
                  th:text="#{payment.uptodate}">up to date</span>
        </a>
    </div>

    <div th:replace="~{fragments/paging :: controls(${paged}, ${params})}"></div>
</main>
</body>
</html>
