<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Payments')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<main class="page">
    <div class="alert alert-info" th:if="${flash}" th:text="${flash}">Saved.</div>
    <div class="alert alert-error" th:if="${flashError}" th:text="${flashError}">Error.</div>

    <div class="page-head list-head">
        <div>
            <h1>
                <span th:text="#{payment.title}">Payments</span>
                <span class="count-note"
                      th:text="'(' + #{payment.totals(${paged.totalRows}, ${header.churchName})} + ')'">
                    (3 receipts in St. Mary's Cathedral)
                </span>
            </h1>
        </div>
        <div class="form-actions">
            <a class="btn btn-quiet" th:if="${header.can('PERM_PAYMENT_EDIT')}"
               th:href="@{/payments/opening-balance}"
               th:text="#{payment.openingBalances}">Opening balances</a>
            <a class="btn btn-quiet" th:if="${header.can('PERM_PAYMENT_ADD')}"
               th:href="@{/payments/dues}" th:text="#{payment.generateDues}">Generate dues</a>
            <a class="btn" th:if="${header.can('PERM_PAYMENT_ADD')}"
               th:href="@{/payments/collect}" th:text="#{payment.collect}">Collect payment</a>
        </div>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th th:text="#{payment.column.receipt}">Receipt</th>
            <th th:text="#{payment.column.date}">Date</th>
            <th th:text="#{payment.column.family}">Family</th>
            <th class="num" th:text="#{payment.column.amount}">Amount</th>
            <th th:text="#{payment.column.mode}">Mode</th>
            <th class="acts" th:text="#{table.operations}">Operations</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(paged.rows)}">
            <td colspan="6" class="empty-cell" th:text="#{payment.empty}">
                No payments recorded yet.
            </td>
        </tr>
        <tr th:each="row : ${paged.rows}">
            <td data-label="Receipt">
                <a th:href="@{/payments/{id}(id=${row.id})}" th:text="${row.receiptNo}">R-2026-0001</a>
                <span class="pill pill-off" th:if="${row.voided}" th:text="#{payment.void}">Void</span>
            </td>
            <td data-label="Date" th:text="${@dates.format(row.receiptDate)}">01-06-2026</td>
            <td data-label="Family">
                <span th:text="${row.familyName}">Family</span>
                <span class="id-tag" th:text="${row.familyCode}">FAM-001</span>
            </td>
            <td data-label="Amount" class="num"
                th:text="'₹' + ${#numbers.formatDecimal(row.amount, 1, 'COMMA', 2, 'POINT')}">₹500.00</td>
            <td data-label="Mode" class="muted-cell" th:text="${row.mode}">Cash</td>
            <td class="acts">
                <a class="link" th:href="@{/payments/{id}(id=${row.id})}" th:text="#{action.view}">View</a>
                <a class="link" th:unless="${row.voided}"
                   th:href="@{/payments/{id}/print(id=${row.id})}" th:text="#{payment.print}">Print</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/paging :: controls(${paged}, ${params})}"></div>
</main>
</body>
</html>
