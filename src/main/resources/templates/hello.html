<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${appName}">Church App</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #1c1e21;
            --muted: #6b7280;
            --accent: #7a1f2b;
            --border: #e3e5e8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 2.5rem 3rem;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            text-align: center;
            max-width: 32rem;
        }

        h1 {
            margin: 0 0 .5rem;
            font-size: 1.75rem;
            color: var(--accent);
        }

        p.greeting {
            margin: 0 0 1.5rem;
            font-size: 1.1rem;
        }

        p.meta {
            margin: 0;
            font-size: .85rem;
            color: var(--muted);
            line-height: 1.6;
        }

        code {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: .1rem .35rem;
            font-size: .8rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${appName}">Church App</h1>
    <p class="greeting">Hello, <strong th:text="${name}">World</strong>!</p>
    <p class="meta">
        Spring Boot 4.1.0 &middot; Thymeleaf &middot; Java 17<br>
        Try <code>/hello?name=Parish</code>
    </p>
</div>
</body>
</html>
