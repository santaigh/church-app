<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password — Church App</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body th:classappend="${platform} ? 'theme-platform' : ''">
<div class="centered">
    <div class="card card-narrow">
        <div class="brand">
            <h1>Forgot password</h1>
            <p class="brand-sub">Reset your account password</p>
        </div>

        <p class="form-note" style="margin-top:0">
            Enter the email address or mobile number registered against your account.
            Your password will be reset, and you will be asked to choose a new one when
            you next sign in.
        </p>

        <form th:action="@{${formAction}}" method="post">
            <div class="field">
                <label for="identifier">Email or mobile number</label>
                <input type="text" id="identifier" name="identifier" required autofocus
                       placeholder="you@example.com or 9840100001">
            </div>

            <button class="btn btn-block" type="submit">Reset my password</button>
        </form>

        <p class="form-note">
            <a th:href="@{${backAction}}">Back to sign in</a>
        </p>
    </div>
</div>
</body>
</html>
