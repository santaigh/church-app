<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password — Church App</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/password-toggle.js}" defer></script>
</head>
<body th:classappend="${platform} ? 'theme-platform' : ''">
<div class="centered">
    <div class="card card-narrow">
        <div class="brand">
            <h1>Change password</h1>
            <p class="brand-sub" th:if="${displayName}" th:text="${displayName}">Name</p>
        </div>

        <!-- Shown on first sign-in, when password_flag is still 0. -->
        <div class="alert alert-warn" th:if="${forced}">
            You are using a system-assigned password. Please choose your own before continuing.
        </div>

        <div class="alert alert-error" th:if="${errorMessage}" role="alert" th:text="${errorMessage}">
            Error.
        </div>

        <form th:action="@{${formAction}}" method="post">
            <div class="field">
                <label for="currentPassword">Current password</label>
                <input type="password" id="currentPassword" name="currentPassword"
                       autocomplete="current-password" required autofocus>
            </div>

            <div class="field">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" name="newPassword"
                       autocomplete="new-password" required>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       autocomplete="new-password" required>
            </div>

            <button class="btn btn-block" type="submit">Change password</button>
        </form>

        <!-- While forced, the only way out is to sign out; the dashboard is unreachable. -->
        <p class="form-note" th:if="${forced}">
            Not ready?
            <span th:remove="tag" th:if="${logoutAction}">
                <form th:action="@{${logoutAction}}" method="post" style="display:inline">
                    <button class="btn-link" type="submit">Sign out</button>
                </form>
            </span>
        </p>
        <p class="form-note" th:unless="${forced}">
            <a th:href="@{${cancelAction}}">Back to dashboard</a>
        </p>
    </div>
</div>
</body>
</html>
